<!-- Erzeugt von 09-gen-fontconfig.sh am 2026-10-18. Ausgeschlossene Ordner: /usr/share/fonts/google-droid-sans-fonts -->
<fontconfig>
  <dir>/usr/share/fonts/Adwaita</dir>
  <dir>/usr/share/fonts/awesome-terminal-fonts</dir>
